<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login Page</title>
        <link rel="stylesheet" href="../CSS/login.css">
        <link rel="stylesheet" href="../fontawesome-free-7.2.0-web/css/all.min.css">

    </head>
    <body>
        <div class="side-pane">
            <img src="../Images/IMG-20260701-WA6106.jpg" alt="side-pane" >
        </div>
        <div class="main-block">
            <div class="back-home">
                <a href="Index.html"><i class="fa fa-arrow-left-long"></i> Home</a>
            </div>
            <div class="login-card">
                
                <h1 id="heading">Welcome Back</h1>
                <p id="subheading">Sign into your Account</p>

                <div class="login-switch">
                    <button type="button" class="active switch-btn" data-target="login">Sign In</button>
                    <button type="button" class="switch-btn" data-target="sign-up">Create Account</button>
                </div>
                <p>Continue with</p>
                <div class="sign-in-with">
                    <button type="button" class="signin-btn"><i class="fa fa-google"></i>Google</button>
                    <button type="button" class="signin-btn"><i class="fa fa-facebook-f"></i>Facebook</button>
                </div>

                <p>or continue with email</p>
                <div class="Login" id="login">
                    <form method="get" class="input-form" action="menu.html">
                        <div class="typing">
                            <div class="entry">
                                <label>Email address</label>
                                <div class="email-entry">
                                    <i class="fa fa-envelope-open"></i>
                                    <input type="email" name="" value="" placeholder="you@xyz.com" required>
                                </div>
                                
                            </div>

                            <div class="entry">
                                <label>Password</label>
                                <div class="password-entry">
                                    <i class="fa fa-key"></i>
                                    <input type="password" name="" value="" placeholder="your password" minlength="8" required>
                                    <button type="button" title="Show" class="eye-btn"><i class="fa fa-eye"></i></button>
                                </div>
                            </div>
                        </div>

                        <div class="signedin">
                            <span class="remember-me">
                                <input type="checkbox" name="" value="" title="signed in">
                                <label>remember me</label>
                            </span>

                            <a href="#">Forgot Password?</a>
                        </div>

                        <div class="signin-btn">
                            <button type="submit" value="" name="">Sign in</button>
                        </div>
                    </form>

                </div>
                <div class="sign-up" id="signup">
                    <form method="get" class="input-form" action="menu.html">
                        <div class="typing">

                            <div class="entry">
                                <label>Full name</label>
                                <div class="email-entry">
                                    <i class="fa fa-user"></i>
                                    <input type="text" name="" value="" placeholder="Full name" required>
                                </div>
                                
                            </div>

                            <div class="entry">
                                <label>Email Address</label>
                                <div class="email-entry">
                                    <i class="fa fa-envelope-open"></i>
                                    <input type="email" name="" value="" placeholder="you@xyz.com" required>
                                </div>
                                
                            </div>

                            <div class="entry">
                                <label>Phone Address</label>
                                <div class="email-entry">
                                    <i class="fa fa-address-book"></i>
                                    <input type="tel" name="" value="" placeholder="08000000000" maxlength="14" required>
                                </div>
                                
                            </div>

                            <div class="entry">
                                <label>Password</label>
                                <div class="password-entry">
                                    <i class="fa fa-key"></i>
                                    <input type="password" name="" value="" placeholder="your password" minlength="8" required>
                                    <button type="button" title="Show" class="eye-btn"><i class="fa fa-eye"></i></button>
                                </div>
                            </div>
                        </div>

                         <div class="signin-btn">
                            <button type="submit" value="" name="">Create Account</button>
                        </div>
                    </form>

                </div>
            </div>    
        </div>
        <script src="../JS/login.js"></script>
    </body>
</html>
