<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login Page</title>
        <link rel="stylesheet" href="../CSS/login.css">
        <link rel="stylesheet" href="../fontawesome-free-7.2.0-web/css/all.min.css">

    </head>
    <body>
        <div class="main-block">
            <div class="login-card">
                
                <h1 id="heading">Welcome Back</h1>
                <p id="subheading">Sign into your Account</p>

                <div class="login-switch">
                    <button type="button" class="active switch-btn" data-target="login">Sign In</button>
                    <button type="button" class="switch-btn" data-target="sign-up">Create Account</button>
                </div>
                <p>Continue with</p>
                <div class="sign-in-with">
                    <button type="button" class="signin-btn"><img src="../Images/google-icon-logo-svgrepo-com.svg" alt="Google Icon"width="20"> Google</button>
                    <button type="button" class="signin-btn"><img src="../Images/facebook-3-logo-svgrepo-com.svg" alt="Facebook Icon" width="20">Facebook</button>
                </div>

                <p>or continue with email</p>
                <div class="Login" id="login">
                    <div class="form-error-banner" id="loginError">Incorrect Email or Password. Please try again.</div>
                    <form method="get" class="input-form" action="Index.html" id="loginForm">
                        <div class="typing">
                            <div class="entry">
                                <label>Email address</label>
                                <div class="email-entry">
                                    <i class="fa fa-envelope-open"></i>
                                    <input type="email" name="" value="" placeholder="you@xyz.com" required>
                                </div>
                                
                            </div>

                            <div class="entry">
                                <label>Password</label>
                                <div class="password-entry">
                                    <i class="fa fa-key"></i>
                                    <input type="password" name="" value="" placeholder="your password" minlength="8" required>
                                    <button type="button" title="Show" class="eye-btn"><i class="fa fa-eye"></i></button>
                                </div>
                            </div>
                        </div>

                        <div class="signedin">
                            <span class="remember-me">
                                <input type="checkbox" name="" value="" title="signed in">
                                <label>remember me</label>
                            </span>

                            <a href="#">Forgot Password?</a>
                        </div>

                        <div class="signin-btn">
                            <button type="submit" value="" name="">Sign in</button>
                        </div>
                    </form>

                </div>
                <div class="sign-up" id="signup">
                    <form method="get" class="input-form" action="Index.html" id="signupform">
                        <div class="typing">

                            <div class="entry">
                                <label>Full name</label>
                                <div class="email-entry">
                                    <i class="fa fa-user"></i>
                                    <input type="text" name="" value="" placeholder="Full name" required>
                                </div>
                                
                            </div>

                            <div class="entry">
                                <label>Email Address</label>
                                <div class="email-entry">
                                    <i class="fa fa-envelope-open"></i>
                                    <input type="email" id="email" name="" value="" placeholder="you@xyz.com" required>
                                    <span class="error-msg" id="emailError">
                                        <i class="fa fa-exclamation-circle"></i>
                                    <span class="error-text"></span>
                                </span>
                                </div>
                                
                            </div>

                            <div class="entry">
                                <label>Phone Address</label>
                                <div class="email-entry">
                                    <i class="fa fa-address-book"></i>
                                    <input type="tel" name="" value="" placeholder="08000000000" maxlength="11" required>
                                </div>
                                
                            </div>

                            <div class="entry">
                                <label>Password</label>
                                <div class="password-entry">
                                    <i class="fa fa-key"></i>
                                    <input type="password" name="" value="" placeholder="your password" minlength="8" required>
                                    <button type="button" title="Show" class="eye-btn"><i class="fa fa-eye"></i></button>
                                </div>
                            </div>
                        </div>

                         <div class="signin-btn">
                            <button type="submit" value="" name="">Create Account</button>
                        </div>
                    </form>

                </div>
            </div>
            <div class="login-approval-msg" id="approve-msg">
                <p>Sign In Approved ✅✅</p>
            </div>    
            <div class="signup-confirm-msg">
                <p>Your Account has been Created Successfully</p>
                <p>✅✅</p>
            </div>
            <div class="page-loader" id="pageloader">
                <div class="spinner"></div>
                <p>Please Wait... </p>
            </div>
        </div>
        <script src="../JS/login.js"></script>
    </body>
</html>
